[tools]
erlang = "27"
elixir = "1.19"
python = "3.12"

[tasks.setup]
description = "Install all dependencies"
run = [
    "mix deps.get",
    "uv sync",
    "mix snarky.setup",
]

[tasks.start]
description = "Start Snarky"
run = "mix snarky"

[tasks.test]
description = "Run test suite"
run = "mix test"

[tasks.fmt]
description = "Format code"
run = "mix format"

[tasks.check]
description = "Compile with warnings as errors and check format"
run = ["mix compile --warnings-as-errors", "mix format --check-formatted", "mix test"]

[tasks."tts:test"]
description = "Test TTS with Kokoro"
run = 'uv run python -m mlx_audio.tts.generate --model "prince-canuma/Kokoro-82M" --text "Snarky is ready" --play'

[tasks."tts:say"]
description = "Speak text with Kokoro (pass text as argument)"
run = 'uv run python -m mlx_audio.tts.generate --model "prince-canuma/Kokoro-82M" --text "$1" --play'
